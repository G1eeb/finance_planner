{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Finance Planner{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <img src="{% static 'homepage/img/logo.svg' %}"
         alt="Finance Planner"
         class="finance-planner-logo">

    {% include "includes/navigation.html" %}

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container">
        <p>
            © <span id="current-year"></span> Finance Planner
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
